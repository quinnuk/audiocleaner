name: Release Build

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-upload:
    name: Build Windows exe and attach to release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller AudioCleaner.spec

      - name: Verify the executable was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AudioCleaner.exe")) {
            Write-Error "dist/AudioCleaner.exe was not produced"
            exit 1
          }
          Write-Host "Build OK: $((Get-Item dist/AudioCleaner.exe).Length) bytes"

      - name: Upload exe to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} dist/AudioCleaner.exe --clobber
