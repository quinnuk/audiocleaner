name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Syntax, unit & integration tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AudioCleaner's own runtime dependencies
        run: |
          pip install -r requirements.txt

      - name: Install test dependencies
        run: |
          pip install pytest

      - name: Install mkvtoolnix & mediainfo
        run: |
          sudo apt-get update
          sudo apt-get install -y mkvtoolnix mediainfo

      - name: Python syntax validation
        run: |
          python -m py_compile $(find audiocleaner -name "*.py")

      - name: Import test (non-GUI modules)
        run: |
          python -c "from audiocleaner import probe, processor, scanner, watcher, logger, codec_rank, config"

      - name: Unit + integration tests
        run: |
          pytest tests/ -v

  windows-build:
    name: PyInstaller build & launch smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller AudioCleaner.spec

      - name: Verify the executable was produced
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AudioCleaner.exe")) {
            Write-Error "dist/AudioCleaner.exe was not produced"
            exit 1
          }
          Write-Host "Build OK: $((Get-Item dist/AudioCleaner.exe).Length) bytes"

      - name: Launch executable smoke test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/AudioCleaner.exe").Path
          $proc = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($proc.HasExited) {
              Write-Error "AudioCleaner.exe exited during the launch smoke test with code $($proc.ExitCode)"
              exit 1
            }
            Write-Host "Launch OK: process remained running for 8 seconds"
          }
          finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
